kind: target
type: aprilgrid
name: aprilgrid_6x6_acrylic
rows: 6
cols: 6
tag_family: 36h11
tag_size_m: 0.050          # black square edge (printed caption: 5.0 cm); R6 calibration fit, 2026-11-17
tag_spacing_ratio: 0.2     # gap / tag_size (caption: spacing 1.0 cm); pitch 60 mm
id_origin: bottom_left     # verified 2026-11-12 on xperia1m3_aprilgrid_eis.mp4 (frame 368)
id_origin_verified: true
tag_rotation_deg: 180      # OpenCV corners 0..3 = board BR, BL, TL, TR (verified)
border_bits: 2             # Kalibr: 2-bit black border (10x10-bit tags); verified 2026-11-17 on R6 images
material: acrylic (printed in Taiwan)
thermal_expansion_per_K: 7.0e-5
dimensions_certified: false
notes: >
  Original Kalibr YAML/PDF no longer downloadable. Printed caption: "... 5.0cm and
  spacing=1.0cm". 2026-11-17: a sweep of calibrations on the R6 30 cm set gives the
  lowest residuals at tag 50.0 mm / gap 10.0 mm (±0.5 mm already 6x worse). The earlier
  43.13 mm / 0.391 values came from detections with the wrong (1-bit) tag border.
  The ratio is what calibration needs; absolute scale (pitch 60 mm) still needs a
  caliper check across the full board before trusting metric results.
